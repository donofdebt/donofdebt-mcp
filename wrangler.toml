# Deploy your own copy: node scripts/build.mjs && npx wrangler deploy
name = "donofdebt-mcp"
main = "dist/worker.js"
compatibility_date = "2026-11-10"
workers_dev = true

# 60 requests per minute per client IP (Workers Rate Limiting binding)
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
